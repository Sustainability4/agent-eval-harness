[project]
name = "agenteval"
version = "0.1.0"
description = "Rubric-based evaluation of tool-use agent trajectories with an LLM-as-judge and agreement statistics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
gemini = ["google-genai>=1.0"]
openai = ["openai>=1.40"]
all = ["anthropic>=0.40", "google-genai>=1.0", "openai>=1.40"]
dev = ["pytest>=8"]

[project.scripts]
agenteval = "agenteval.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
